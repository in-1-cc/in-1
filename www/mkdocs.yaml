site_name: in-1
site_url: https://in-1.cc
site_description:
  Instant dev tools for your current shell
site_author: Ingy dot Net

repo_name: in-1-cc/in-1
repo_url: https://github.com/in-1-cc/in-1
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  # Light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  # Dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

# The home page is not in the nav on purpose: it gets no tab and no
# sidebar entry; the header title and logo link to it (extra.homepage)
nav:
- Install: install/index.md
- Documentation:
  - doc/index.md
  - Usage: doc/usage.md
  - Tools: doc/tools.md
  - Design: doc/design.md

markdown_extensions:
- admonition
- attr_list
- def_list
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.magiclink:
    repo_url_shorthand: true
    user: in-1-cc
    repo: in-1
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true

plugins:
- search

extra:
  homepage: /home/
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/in-1-cc/in-1
